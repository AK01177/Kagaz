[pytest]
pythonpath = backend
testpaths = backend/tests
addopts =
    --ignore=test_api.py
    --ignore=backend/tests/test_classification.py
    --ignore=backend/tests/test_secure_auth.py
    --ignore=backend/tests/test_db02_identity_and_tenancy.py
    --ignore=backend/tests/test_qa07_upload.py
filterwarnings =
    ignore::DeprecationWarning:httpx.*
    ignore::PendingDeprecationWarning:starlette.*
    ignore::ResourceWarning
