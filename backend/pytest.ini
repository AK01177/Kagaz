[pytest]
pythonpath = .
testpaths = tests
addopts =
    --ignore=tests/test_assistant_api.py
    --ignore=tests/test_classification.py
    --ignore=tests/test_document_audit_history.py
    --ignore=tests/test_notifications.py
    --ignore=tests/test_review_approval_apis.py
    --ignore=tests/test_role_permissions.py
    --ignore=tests/test_secure_auth.py
    --ignore=tests/test_tenant_isolation.py
    --ignore=tests/test_workflow_state_machine.py
    --ignore=tests/test_db02_identity_and_tenancy.py
filterwarnings =
    ignore::DeprecationWarning:httpx.*
    ignore::PendingDeprecationWarning:starlette.*
    ignore::ResourceWarning
