# Run the whole stack locally:  docker compose up --build
# Supabase Auth stays hosted; fill backend/.env and frontend/.env first (see the .env.example files).
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: kagaz
      POSTGRES_PASSWORD: kagaz
      POSTGRES_DB: kagaz
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kagaz"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg2://kagaz:kagaz@db:5432/kagaz
      REDIS_URL: redis://redis:6379/0
      DOCUMENT_STORAGE_DIR: /app/storage_data
      CORS_ALLOWED_ORIGINS: http://localhost:3002
    volumes:
      - uploads:/app/storage_data
    ports:
      - "8001:8001"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_API_URL: http://backend:8001
    ports:
      - "3002:3000"
    depends_on:
      - backend

volumes:
  pgdata:
  uploads:
