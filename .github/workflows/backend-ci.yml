# Place this file at: .github/workflows/ci.yml
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel older runs of the same branch/PR when a new commit is pushed
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend - install, build check & tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"          # change to the version your team uses
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-cov

      - name: Build check (compile all backend code)
        run: python -m compileall -q backend

      - name: Run tests
        env:
          # Dummy values so tests never need real secrets / paid API calls.
          # Mock external calls (LLM / classifier API) inside the tests.
          TYPESAFE_API_KEY: "dummy-key-for-ci"
        run: pytest test backend -v --maxfail=5 --cov=backend --cov-report=term-missing

  frontend:
    name: Frontend - install & build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Remove this job if the frontend isn't part of the CI scope yet.

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build